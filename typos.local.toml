# Repository-specific identifiers and formal names.

schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]
# "mold" names the linker (https://github.com/rui314/mold); it is not a
# misspelling of "mould" in that context.
mold = "mold"

[patterns]
ignore = [
  # Preserve exact formal product and documentation names across line wrapping.
  'Azure Architecture\s+Center\s+\|\s+Microsoft Learn',
  'GitHub\s+Flavored\s+Markdown',
]

[files]
exclude = []
