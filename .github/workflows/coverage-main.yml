name: Coverage (main)

# Main owns both persistent coverage outputs: the CodeScene upload and the
# ratchet baseline. Pull requests generate coverage only for their own ratchet
# check, in ci.yml; they neither publish a report nor contact CodeScene.
# CodeScene accepts `cs-coverage upload` only for an analysed branch, which a
# pull request head is not, and its check mode fails on every project whose
# coverage gates are off. Caches written on main are readable by every
# pull-request run, so the baseline written here is the one those ratchet
# checks compare against. tests/workflow_contracts/codescene_coverage_test.py
# holds this shape.
#
# Known exception: a Dependabot pull request merged by the automerge workflow
# with GITHUB_TOKEN fires no push event, so that merge publishes nothing until
# the next push to main (shared-actions #518 tracks the fix).

'on':
  push:
    branches: [main]
  # A dispatch may name any branch, so the upload step's ref conjunct is what
  # keeps a branch's coverage out of CodeScene.
  workflow_dispatch:

# One group per ref, never cancelled. A cancelled publisher abandons both its
# upload and its baseline write. With cancellation off, runs never overlap and
# a newer trigger replaces any pending run, so for triggered runs (push and
# dispatch) uploads land in commit order and the newest baseline wins. A manual
# "Re-run jobs" on an older main run is an operator action: it keeps its old
# SHA and republishes that commit's coverage and baseline until the next push
# supersedes it. Keying the group on the event as well would let an earlier
# dispatch finish after a newer push and upload older coverage last. A dispatch
# that replaces a pending push uploads the same or a newer commit, but
# generate-coverage saves the baseline only on a push, so the baseline stays
# one commit behind until the next push (shared-actions #518).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    runs-on: ubuntu-latest
    # The CodeScene token lives in this environment, whose deployment policy
    # admits `main` alone; the codescene environment contract holds it to
    # this job.
    environment: codescene
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@759da19f0379b6d2d7ddef93b7ad4c3b98154e41
      - name: Install mold linker
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # mold accelerates dev builds; coverage uses lld for llvm-tools compatibility.
          sudo apt-get update \
            && sudo apt-get install --yes --no-install-recommends clang lld mold
      - name: Install test runner
        env:
          RUSTFLAGS: ""
        run: cargo binstall --no-confirm --locked cargo-nextest
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@759da19f0379b6d2d7ddef93b7ad4c3b98154e41
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          RUSTFLAGS: -C link-arg=-fuse-ld=lld
          CFLAGS: -fuse-ld=lld
          LDFLAGS: -fuse-ld=lld
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
      # Whether the token is set, as a plain step output. The expression is
      # evaluated before the shell runs, so this step binds nothing: the token
      # sits in no `env` in this workflow, because the upload action is
      # composite and hands its step's `env` to the nested steps it runs.
      - name: Check CodeScene token
        id: codescene-token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Upload coverage data to CodeScene
        if: ${{ steps.codescene-token.outputs.available == 'true' && github.ref == 'refs/heads/main' }}
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@759da19f0379b6d2d7ddef93b7ad4c3b98154e41
        with:
          path: lcov.info
          format: lcov
          mode: upload
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
