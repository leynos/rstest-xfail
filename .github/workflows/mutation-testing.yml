name: Mutation testing

# Thin caller of the shared mutation-testing reusable workflow; caller
# guide: leynos/shared-actions docs/mutation-cargo-workflow.md.
on:
  schedule:
    - cron: "35 11 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mutation-testing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mutation:
    permissions:
      contents: read
      id-token: write # OIDC workflow-source resolution
    uses: leynos/shared-actions/.github/workflows/mutation-cargo.yml@82feb2b7aac45b7efff40c9c4bb632551b14521c
    with:
      # Mirror the CI test baseline, which runs with --all-features.
      extra-args: "--all-features"
      # .cargo/config.toml links with clang + mold; install the same
      # packages the CI build-test job installs before running tests.
      setup-commands: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends clang lld mold
